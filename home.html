<script src="collage/manifest.js"></script>
<script>
(() => {
  // ---- bullet holes: click the logo to pierce it ----
  // the SVG is inlined, so only its painted paths register hits —
  // clicks in the negative space fall through
  const slot = document.querySelector('.logo-slot');

  const fade = el => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 2800);
  };

  // drips live inside the logo slot at fractional coords, so they stay
  // anchored to their hole through resizes. The trail is built from fixed
  // segments — only the growing tip meanders, never the origin.
  const drip = (fx, fy, sc, hole) => {
    if (document.querySelectorAll('.drip').length >= 25) return false;
    const d = document.createElement('div');
    d.className = 'drip';
    d.style.left = (fx * 100) + '%';
    // start at the bottom of the hole's black core, not the click point
    d.style.top = 'calc(' + (fy * 100) + '% + ' + Math.round(4 * sc) + 'px)';
    slot.appendChild(d);
    let hgt = 0, dx = Math.floor(Math.random() * 3) - 1;
    const step = () => {
      const top = d.getBoundingClientRect().top;
      if (top + hgt >= innerHeight) {
        // reached the bottom: linger, fade the streak, then the hole
        setTimeout(() => {
          d.style.opacity = '0';
          setTimeout(() => {
            d.remove();
            fade(hole);
          }, 2600);
        }, 4000);
        return;
      }
      const sh = Math.min(Math.round(1 + Math.random() * 4), innerHeight - top - hgt);
      if (Math.random() < 0.14) dx += Math.random() < 0.5 ? -1 : 1;
      const s = document.createElement('span');
      s.style.cssText = 'position:absolute;width:2px;background:#e8121c;left:' +
        dx + 'px;top:' + hgt + 'px;height:' + sh + 'px;';
      d.appendChild(s);
      hgt += sh;
      setTimeout(step, 60 + Math.random() * 140);
    };
    setTimeout(step, 400 + Math.random() * 900);
    return true;
  };

  slot.addEventListener('pointerdown', e => {
    if (!e.target.closest || !e.target.closest('path')) return;
    if (slot.querySelectorAll('.hole').length >= 40) return;
    const r = slot.getBoundingClientRect();
    // fractional coords: holes track the logo through resizes
    const fx = (e.clientX - r.left) / r.width;
    const fy = (e.clientY - r.top) / r.height;
    const sc = 0.75 + Math.random() * 0.5;
    const hole = document.createElement('img');
    hole.src = 'assets/bullet-hole' + (1 + Math.floor(Math.random() * 3)) + '.png';
    hole.className = 'hole';
    hole.alt = '';
    hole.style.left = (fx * 100) + '%';
    hole.style.top = (fy * 100) + '%';
    hole.style.transform =
      'rotate(' + 90 * Math.floor(Math.random() * 4) + 'deg)' +
      ' scale(' + sc.toFixed(2) + ')';
    slot.appendChild(hole);
    // every hole bleeds; if the drip cap is hit, the hole fades on its own timer
    if (!drip(fx, fy, sc, hole))
      setTimeout(() => fade(hole), 9000);
  });

  // ---- rubik drum ----
  // Two invisible 6-sided rings (square faces) sharing one center window.
  // All images live on one virtual 2D lattice: the viewer stands at
  // (col, row); left/right turns step the column, up/down turns step the
  // row. Center = lattice(col,row), flanks = its true neighbours, so
  // movement is consistent and reversible in every direction.
  const stage = document.querySelector('.collage');

  // intro lock: ignore interaction while the cube plays its entrance.
  // The entrance no longer runs on a blind page-load timer — it is started
  // by `startIntro()` once the first visible faces have actually decoded,
  // so the cube never scales up over empty/half-painted stickers.
  let introLock = true, introStarted = false;
  const startIntro = () => {
    if (introStarted) return;
    introStarted = true;
    document.body.classList.add('cube-ready');   // CSS entrance fires here
    // unlock interaction when the entrance finishes (0.2s delay + 1.4s run)
    setTimeout(() => { introLock = false; }, 1650);
    // then hold a beat before the demo spin, so it reads as a separate
    // gesture rather than a continuation of the entrance
    setTimeout(() => { if (pool.length) turn(ringY, -1, 900); }, 3400);
  };
  const mod = (n, m) => ((n % m) + m) % m;

  const makeRing = axis => {
    const el = document.createElement('div');
    el.className = 'drum';
    stage.appendChild(el);
    const ring = { axis, el, rot: 0, step: 60, base: [], ovr: new Map(), faces: [] };
    for (let i = 0; i < 6; i++) {
      const f = document.createElement('div');
      f.className = 'face';
      const bg = new Image();     // blurred duplicate fills the block
      bg.className = 'bg';
      bg.draggable = false;
      const img = new Image();    // sharp copy, never cropped
      img.className = 'fg';
      img.draggable = false;
      const shade = document.createElement('div');   // depth shading
      shade.className = 'shade';
      f.appendChild(bg);
      f.appendChild(img);
      f.appendChild(shade);
      el.appendChild(f);
      ring.faces.push({ f, img, bg, shade });
    }
    return ring;
  };
  const ringY = makeRing('Y');
  const ringX = makeRing('X');
  const rings = [ringY, ringX];
  let owner = ringY;                 // which ring occupies the shared center

  // cube-slice model: each ring owns a strip (disjoint halves of the
  // pool) plus sparse overrides. Whatever image occupies the center gets
  // planted into a ring's center slot when that ring starts turning, so
  // the center sticker physically rides away and returns on reversal —
  // and cross-axis flanks never change, like a real Rubik's cube.
  let pool = [];
  const srcAt = (r, v) =>
    r.ovr.get(v) !== undefined ? r.ovr.get(v) : r.base[mod(v, r.base.length)];
  const centerSlot = r => Math.round(-r.rot / r.step);
  const takeCenter = r => {
    if (r === owner || !pool.length) return;
    r.ovr.set(centerSlot(r), srcAt(owner, centerSlot(owner)));
    owner = r;
    assign(r, r.rot, false);   // sync its (hidden) center face — no visible change
  };

  // finds images via collage/manifest.js, or by probing numbered names
  const discover = () => new Promise(res => {
    if (window.COLLAGE && window.COLLAGE.length)
      return res(window.COLLAGE.map(f => 'collage/' + f));
    const found = [], exts = ['png', 'jpg', 'jpeg', 'webp', 'gif'];
    let pending = 60 * exts.length;
    for (let i = 1; i <= 60; i++) for (const x of exts) {
      const im = new Image();
      const done = ok => { if (ok) found.push(im.src); if (!--pending) res(found); };
      im.onload = () => done(true);
      im.onerror = () => done(false);
      im.src = 'collage/' + i + '.' + x;
    }
  });

  // square faces: both rings share identical hexagon geometry
  const layout = () => {
    const a = ringY.el.offsetWidth / 2 * Math.sqrt(3);
    rings.forEach(r => r.faces.forEach((fc, i) =>
      fc.f.style.transform =
        'rotate' + r.axis + '(' + i * 60 + 'deg) translateZ(' + a.toFixed(1) + 'px)'));
    rings.forEach(apply);
  };
  addEventListener('resize', layout);

  const apply = r => {
    r.el.style.transform = 'rotate' + r.axis + '(' + r.rot + 'deg)';
    r.faces.forEach((fc, i) => {
      const world = mod(i * r.step + r.rot + 180, 360) - 180;
      const aw = Math.abs(world);
      // one strict visibility pass: nothing past 90°, and the shared
      // center plane belongs to the owning ring only
      fc.f.style.visibility =
        (aw > 90 || (r !== owner && aw < r.step / 2)) ? 'hidden' : '';
      // depth shadows: skewed faces darken toward their outer edge
      const t = Math.min(1, aw / r.step);
      const dir = r.axis === 'Y'
        ? (world > 0 ? 'right' : 'left')
        : (world > 0 ? 'top' : 'bottom');
      // only rewrite the gradient when the side actually flips — avoids a
      // full repaint of the shade layer on every drag frame
      if (fc._dir !== dir) {
        fc.shade.style.background =
          'linear-gradient(to ' + dir + ', rgba(0,0,0,0.03), rgba(0,0,0,0.7))';
        fc._dir = dir;
      }
      fc.shade.style.opacity = t.toFixed(2);
    });
  };

  // map each face to its lattice cell. Ring Y slots walk columns at the
  // current row; ring X slots walk rows at the current column.
  const assign = (r, targetRot, onlyHidden) => {
    if (!r.base.length) return;
    r.faces.forEach((fc, i) => {
      const world = mod(i * r.step + r.rot + 180, 360) - 180;
      if (onlyHidden && Math.abs(world) < 90) return;
      const v = i + 6 * Math.round((-targetRot / r.step - i) / 6);
      const src = srcAt(r, v);
      if (fc.img.getAttribute('src') !== src) { fc.img.src = src; fc.bg.src = src; }
    });
  };

  const centers = () => rings.forEach(apply);

  const turn = (r, steps, ms) => {
    takeCenter(r);                    // center sticker rides with this ring
    const target = (Math.round(r.rot / r.step) + steps) * r.step;
    assign(r, target, true);          // pre-swap this ring's hidden faces
    r.el.style.transition = 'transform ' + ms + 'ms cubic-bezier(0.2, 0.9, 0.25, 1)';
    r.rot = target;
    centers();
    setTimeout(() => assign(r, r.rot, true), ms + 30);
  };

  // drag: first significant movement locks onto one ring.
  // Live pointer work is coalesced into a single rAF per frame, so rapid
  // multi-swipes stay smooth instead of thrashing style/layout on every
  // pointermove (which can fire 120+/sec on touch screens).
  let drag = null, lastInput = 0, rafPending = false;
  const touch = () => lastInput = performance.now();

  const stepDrag = () => {
    rafPending = false;
    if (!drag || !drag.r) return;
    const nrot = drag.rot0 + drag.d * 0.22;
    const now = performance.now();
    drag.v = (nrot - drag.r.rot) / Math.max(now - drag.t, 1) * 1000;  // deg/s
    drag.t = now;
    drag.r.rot = nrot;
    apply(drag.r);
    assign(drag.r, nrot, true);
  };

  stage.addEventListener('pointerdown', e => {
    if (introLock) return;
    drag = { x: e.clientX, y: e.clientY, r: null, rot0: 0, v: 0, d: 0, t: performance.now() };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('dragging');   // freeze shade easing while live-dragging
    touch();
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.r) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      drag.r = Math.abs(dx) >= Math.abs(dy) ? ringY : ringX;
      drag.rot0 = drag.r.rot;
      takeCenter(drag.r);             // center sticker rides with this ring
      centers();
      drag.r.el.style.transition = 'none';
    }
    drag.d = drag.r.axis === 'Y' ? dx : -dy;
    touch();
    if (!rafPending) { rafPending = true; requestAnimationFrame(stepDrag); }
  });
  const release = () => {
    if (!drag) return;
    stage.classList.remove('dragging');   // restore smooth shade settle
    if (drag.r) turn(drag.r, Math.max(-2, Math.min(2, Math.round(drag.v / 400))), 280);
    drag = null;
    touch();
  };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);

  // arrow keys
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') turn(ringY, 1, 280);
    else if (e.key === 'ArrowRight') turn(ringY, -1, 280);
    else if (e.key === 'ArrowUp') turn(ringX, 1, 280);
    else if (e.key === 'ArrowDown') turn(ringX, -1, 280);
    else return;
    e.preventDefault();
    touch();
  });

  // ambient: turns itself, calmly, when left alone
  const ambient = () => {
    if (!drag && performance.now() - lastInput > 5000)
      turn(Math.random() < 0.5 ? ringY : ringX, Math.random() < 0.5 ? 1 : -1, 700);
    setTimeout(ambient, 6000 + Math.random() * 5000);
  };
  setTimeout(ambient, 7000);

  // Fully fetch + decode one image. Resolves either way: a single missing
  // file must never stall the entrance.
  const preload = src => new Promise(res => {
    const im = new Image();
    im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(res);
    im.onerror = () => res();
    im.src = src;
  });

  // Background-fill the rest of the pool a few at a time. Loading all 20 at
  // once saturates the connection and is what starved the opening frames.
  const drainQueue = (srcs, width = 3) => {
    let i = 0;
    const next = () => { if (i < srcs.length) preload(srcs[i++]).then(next); };
    for (let w = 0; w < width; w++) next();
  };

  discover().then(async list => {
    if (!list.length) return startIntro();   // no images: don't hang the page
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    pool = list;
    // disjoint halves so the two strips never duplicate each other
    const half = Math.ceil(pool.length / 2);
    ringY.base = pool.slice(0, half);
    ringX.base = pool.length > 1 ? pool.slice(half) : pool.slice();
    ringX.ovr.set(0, srcAt(ringY, 0));   // both rings agree on the opening center

    // Only the faces actually on screen at rest gate the entrance: the
    // center sticker and its four immediate neighbours. Everything else
    // streams in behind the animation.
    const first = [...new Set([
      srcAt(ringY, 0), srcAt(ringY, 1), srcAt(ringY, -1),
      srcAt(ringX, 1), srcAt(ringX, -1)
    ])];
    // Never let a slow network hold the page hostage — 2.5s and we go.
    await Promise.race([
      Promise.all(first.map(preload)),
      new Promise(res => setTimeout(res, 2500))
    ]);

    layout();
    rings.forEach(r => { assign(r, r.rot, false); r.el.style.visibility = 'visible'; });
    centers();
    startIntro();
    drainQueue(pool.filter(s => !first.includes(s)));
  });
})();
</script>
</body>
</html>
